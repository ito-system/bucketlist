<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#fffaf2"/><circle cx="920" cy="310" r="235" fill="#f9ead6"/>
<rect x="770" y="101" width="302" height="420" rx="25" fill="#fff" transform="rotate(4 921 311)"/><text x="812" y="163" font-family="sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#bd9874">MY BUCKET LIST</text><text x="812" y="214" font-family="sans-serif" font-size="25" font-weight="700" fill="#463629">いつか、やりたいこと。</text>
<g font-family="sans-serif" font-size="17" fill="#594a3f"><circle cx="827" cy="263" r="10" fill="#e9995b"/><path d="m822 263 4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/><text x="850" y="269">海の見える街へ行く</text><circle cx="827" cy="315" r="10" fill="#fff" stroke="#e8c7a8" stroke-width="2"/><text x="850" y="321">大切な人と旅をする</text><circle cx="827" cy="367" r="10" fill="#fff" stroke="#e8c7a8" stroke-width="2"/><text x="850" y="373">ずっと気になってたカフェ</text></g>
<text x="100" y="165" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="5" fill="#bd6835">YOUR LITTLE DREAMS, ONE BY ONE</text><text x="100" y="280" font-family="sans-serif" font-size="68" font-weight="700" fill="#463629">やりたいことを</text><text x="100" y="375" font-family="sans-serif" font-size="76" font-weight="700" fill="#e98a48">全部叶えよう。</text><text x="104" y="443" font-family="sans-serif" font-size="24" fill="#77685b">いつかの夢を、今日から少しずつ。</text><rect x="100" y="496" width="148" height="7" rx="4" fill="#e98a48"/><text x="100" y="560" font-family="sans-serif" font-size="25" font-weight="700" fill="#463629">夢ノート</text>
